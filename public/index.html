<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1428a0">
  <title>สมุดลูกค้าประกัน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/config.js"></script>
</head>
<body>
  <!-- หน้าจอโหลด -->
  <div id="splash" class="splash">
    <img src="/icons/icon-192.png" alt="" width="72" height="72">
    <p>กำลังโหลด…</p>
  </div>

  <!-- หน้าล็อกอิน -->
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <img src="/icons/icon-192.png" alt="" width="64" height="64">
      <h1>สมุดลูกค้าประกัน</h1>
      <label>ชื่อผู้ใช้
        <input name="username" autocomplete="username" autocapitalize="none" required>
      </label>
      <label>รหัสผ่าน
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="error" hidden></p>
      <button class="btn primary block" type="submit">เข้าสู่ระบบ</button>
    </form>
  </section>

  <!-- แอปหลัก -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div>
        <h1 id="page-title">ปฏิทิน</h1>
        <p id="page-sub" class="sub"></p>
      </div>
      <div id="topbar-actions" class="topbar-actions"></div>
    </header>

    <main id="view" class="view"></main>

    <button id="fab" class="fab" type="button" aria-label="เพิ่ม">＋</button>

    <nav class="tabbar">
      <button type="button" data-tab="calendar" class="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>ปฏิทิน</span>
      </button>
      <button type="button" data-tab="tasks">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8l1.5 1.5L12 7M8 14l1.5 1.5L12 13M14 8h2M14 14h2"/></svg>
        <span>งาน</span>
      </button>
      <button type="button" data-tab="customers">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M16 4a4 4 0 0 1 0 8M22 21c0-3-2-6-5-7"/></svg>
        <span>ลูกค้า</span>
      </button>
      <button type="button" data-tab="summary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg>
        <span>แจ้งเตือน</span>
        <b id="badge" class="badge" hidden></b>
      </button>
    </nav>
  </div>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
